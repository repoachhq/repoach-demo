# Generated by repoach init --ci github.
# Secrets: REPOACH_ANTHROPIC_API_KEY (direct mode) or REPOACH_ANTHROPIC_AUTH_TOKEN
# with the variable REPOACH_LLM_PROXY_BASE_URL (gateway mode).
# Variable REPOACH_ADVISORY_POST=1 turns posting on; anything else is a dry run.
name: repoach review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: repoach-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install repoach (no secret in this step)
        env:
          REPOACH_INSTALL: "repoach @ git+https://github.com/repoachhq/repoach@f8915fc9d4487b5339b816a397c74a40bdfcc5dc"
        run: python3 -c 'import os,sys;keep={"PATH","HOME","LANG","LC_ALL","LC_CTYPE","TZ","TMPDIR","XDG_CONFIG_HOME","XDG_DATA_HOME","XDG_CACHE_HOME","PYTHONPATH","VIRTUAL_ENV","PYTHONHOME","Python_ROOT_DIR","Python3_ROOT_DIR","LD_LIBRARY_PATH","pythonLocation","SSL_CERT_FILE","SSL_CERT_DIR","REQUESTS_CA_BUNDLE","CURL_CA_BUNDLE","HTTP_PROXY","HTTPS_PROXY","NO_PROXY","ALL_PROXY","http_proxy","https_proxy","no_proxy","all_proxy"};os.execvpe(sys.argv[1],sys.argv[1:],{n:v for n,v in os.environ.items() if n in keep or n.startswith(("PIP_",))})' python -m pip install --quiet --disable-pip-version-check "$REPOACH_INSTALL"
      - name: Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOACH_ADVISORY_POST: ${{ vars.REPOACH_ADVISORY_POST }}
          REPOACH_ANTHROPIC_API_KEY: ${{ secrets.REPOACH_ANTHROPIC_API_KEY }}
          REPOACH_LLM_PROXY_BASE_URL: ${{ vars.REPOACH_LLM_PROXY_BASE_URL }}
          REPOACH_ANTHROPIC_AUTH_TOKEN: ${{ secrets.REPOACH_ANTHROPIC_AUTH_TOKEN }}
        run: repoach ci review
